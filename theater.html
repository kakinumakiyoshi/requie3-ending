<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REQUIEⅢ｜モニター</title>
<script src="theater-config.js"></script>
<style>
html,body{margin:0;height:100%;background:#000;color:#efe6d4;overflow:hidden;cursor:none}
body.setup{cursor:default}
.layer{position:fixed;inset:0;transition:opacity 1.2s ease}
.hide{opacity:0!important;pointer-events:none}
video{width:100%;height:100%;object-fit:cover;background:#000}
.serif{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif}
#bgVideo{filter:brightness(.6)}
#bgImg{background:#000 center/cover no-repeat;animation:drift 60s ease-in-out infinite alternate;filter:brightness(.72)}
#bgImg.still{animation:none;filter:brightness(var(--stillBright,1));transform:none}
#bgLayer.still video{filter:brightness(var(--stillBright,1))}
/* ゆっくり寄っていく動き（drift: true の場面） */
#bgLayer.drift video,#bgImg.drift{animation:slowpush 40s ease-in-out infinite alternate}
@keyframes slowpush{from{transform:scale(1)}to{transform:scale(1.08) translateY(-1%)}}
#ovImg{background:center/contain no-repeat}
/* 読み込みの円卓：マスクを1枚ずつ置く層（背景と同じ 16:9 の箱に、背景と同じ明るさで） */
#maskLayer{overflow:hidden}
#maskBox{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%);filter:brightness(var(--stillBright,1))}
#maskBox img{position:absolute;will-change:transform}
/* タイマーの位置：右下（調査の間取り）／上（第3フェーズ） */
#timerLayer.pos-right{align-items:flex-end;justify-content:flex-end;padding:0 4.5vw 6vh 0;background:none;text-align:right}
#timerLayer.pos-right #tClock{font-size:clamp(70px,10vw,200px)}
#timerLayer.pos-top{justify-content:flex-start;padding-top:3vh;background:linear-gradient(rgba(0,0,0,.55),transparent 45%)}
#timerLayer.pos-top #tClock{font-size:clamp(60px,9vw,180px)}
@keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.14) translate(-2%,-1%)}}
#timerLayer{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(80% 70% at 50% 55%,rgba(0,0,0,.45),rgba(0,0,0,.15) 70%,transparent)}
#tPhase,#ttPhase{font:400 clamp(13px,1.45vw,28px) "Bodoni 72","Didot",serif;letter-spacing:.55em;color:#c9a24f;text-shadow:0 2px 10px #000;margin-bottom:.6em;min-height:1em;padding-left:.55em}
#titleLayer{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(70% 60% at 50% 50%,rgba(0,0,0,.5),transparent)}
#ttTitle{font-size:clamp(40px,6vw,120px);letter-spacing:.25em;color:#f3e3c0;text-shadow:0 4px 30px #000}
#tTitle{font-size:clamp(20px,2.3vw,44px);letter-spacing:.5em;padding-left:.5em;color:#e2d8c4;text-shadow:0 2px 16px #000;margin:.2em 0 .3em}
#tClock{font:400 clamp(90px,15.5vw,300px)/1 "Didot","Bodoni 72",serif;letter-spacing:.02em;color:#e2d8c4;text-shadow:0 0 40px rgba(226,216,196,.25),0 6px 40px rgba(0,0,0,.8);transition:color .6s}
#tBar{width:min(32vw,620px);height:1px;background:rgba(201,162,79,.45);margin:.9em auto .6em;position:relative}
#tBar i{position:absolute;left:0;top:-1px;height:3px;background:#c9a24f;width:100%;transition:width .3s linear}
#tLeft{display:none;font:400 clamp(11px,1.1vw,20px) Menlo,monospace;letter-spacing:.15em;color:#9fb7bb}
/* 並び順：真ん中＝PHASE／数字／ゲージ／場面名、右下＝PHASE／場面名／ゲージ／TIME LEFT／数字、上＝PHASE／数字／ゲージ／場面名 */
#timerLayer{text-align:center}
#tPhase{order:0}#tClock{order:1}#tBar{order:2}#tTitle{order:3}#tNote{order:4}
#timerLayer.pos-right #tTitle{order:1;font-size:clamp(22px,2.6vw,50px)}#timerLayer.pos-right #tBar{order:2;margin:1.4em 0 .5em auto;width:min(26vw,520px)}#timerLayer.pos-right #tLeft{display:block;order:3}#timerLayer.pos-right #tClock{order:4;font-family:Menlo,monospace;font-weight:400;letter-spacing:.02em}#timerLayer.pos-right #tNote{order:5}
#timerLayer.pos-right #tBar i{left:auto;right:0}
#tClock.warn{color:#ff8a6a}
#tClock.up{color:#ff5a3a;animation:pulse 1s ease-in-out infinite}
#tNote{margin-top:.4em;font-size:clamp(13px,1.2vw,22px);letter-spacing:.4em;color:#c9a24f;min-height:1.4em;text-shadow:0 2px 10px #000}
#tPaused{position:fixed;right:3vw;top:3vh;font:600 14px system-ui;letter-spacing:.3em;color:#e7d3a6;opacity:.7}
@keyframes pulse{50%{opacity:.35}}
#castLayer{background:radial-gradient(100% 80% at 50% 40%,#2a1c15,#070504)}
.castOne{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:5vw;opacity:0;transition:opacity 1s ease,transform 1.4s ease;transform:scale(1.03)}
.castOne.on{opacity:1;transform:none}
.castOne img{height:72vh;aspect-ratio:3/4;object-fit:cover;border:1px solid #c9a24f55;box-shadow:0 20px 80px #000}
.castOne .role{font-size:clamp(40px,6vw,110px);letter-spacing:.15em;color:#f3e3c0}
.castOne .who{margin-top:.6em;font-size:clamp(20px,2.6vw,48px);letter-spacing:.2em;color:#c9a24f}
.castOne .lbl{font:600 clamp(11px,1vw,16px) system-ui;letter-spacing:.5em;color:#a8916e;margin-bottom:1.2em}
/* 設定書 P1 の画像はそのままの比率で（切り取らない） */
.castOne figure.p1{margin:0;display:flex;flex-direction:column;align-items:center}
.castOne figure.p1 img{height:78vh;width:auto;aspect-ratio:auto;object-fit:contain}
.castOne figure.p1 figcaption{margin-top:2.2vh;font-size:clamp(24px,3vw,56px);letter-spacing:.2em;color:#e2d8c4;text-shadow:0 2px 14px #000}
#castAll{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity 1.5s}
#castAll.on{opacity:1}
#castAll h2{font-weight:400;letter-spacing:.5em;color:#c9a24f;font-size:clamp(16px,1.6vw,28px);margin:0 0 3vh}
#castGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:1.6vw;width:90vw}
#castGrid figure{margin:0;text-align:center}
#castGrid img{width:100%;aspect-ratio:2150/3035;object-fit:contain;border:1px solid #c9a24f44}
#castGrid b{display:block;margin-top:.6em;font-size:clamp(16px,1.7vw,32px);letter-spacing:.1em;color:#f3e3c0;font-weight:400}
#castGrid span{display:block;margin-top:.6em;font-size:clamp(14px,1.4vw,26px);color:#e2d8c4;letter-spacing:.1em}
#textLayer{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 90% at 50% 45%,rgba(30,20,14,.55),rgba(0,0,0,.92))}
#endBgA,#endBgB{transition:opacity 1.6s ease}
/* OP の導入：止めの間は薄い黒の窓、動き出したら窓なしで映像の上に直接 */
#textLayer.intro-box,#textLayer.intro-free{background:none}
/* 窓は文章の量にかかわらず決まった大きさ（大きめ）。文字はその中に */
#textLayer.intro-box #text,#textLayer.intro-free #text{box-sizing:border-box;width:min(84vw,1600px);height:66vh;display:flex;flex-direction:column;justify-content:center;padding:4vh 4.5vw;border-radius:4px;overflow:hidden;font-size:clamp(18px,1.9vw,36px);line-height:1.9;transition:background 1.2s ease,box-shadow 1.2s ease}
#textLayer.intro-box #text{background:rgba(0,0,0,.55);box-shadow:0 0 80px rgba(0,0,0,.5)}
#textLayer.intro-free #text{background:rgba(0,0,0,0);box-shadow:none;text-shadow:0 0 8px #000,0 2px 18px #000,0 0 3px #000}
#text p.fade{opacity:0;transform:translateY(6px);filter:blur(2px);transition:opacity 1s ease,transform 1s ease,filter 1s ease}
#text p.fade.in{opacity:1;transform:none;filter:none}
#text p.fade.in.gone{opacity:0;transition:opacity .9s ease}
#textLayer.onvid{background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,.46),rgba(0,0,0,.78))}
#text{width:min(78vw,1400px);font-size:clamp(20px,2.35vw,44px);line-height:2;letter-spacing:.06em;text-shadow:0 2px 14px #000}
#text p{margin:0 0 .7em;transition:opacity 1.4s ease,filter 1.4s ease}
#text p.old{opacity:.5}
#text p.gone{opacity:0}
#text p.line{color:#f3d9a0}

#textLayer.intro-box #text p.line:first-child{letter-spacing:.2em}
#text .c{opacity:0;animation:in .45s ease forwards}
@keyframes in{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:none}}
#endWait{display:flex;align-items:center;justify-content:center;background:#000}
#endWait img,#closing img{width:min(46vw,720px);-webkit-mask-image:radial-gradient(ellipse closest-side,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse closest-side,#000 30%,transparent 100%)}
#endWait img{opacity:.55;animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.85}}
#closing{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.2em;font-size:clamp(18px,1.9vw,34px);line-height:1.9;letter-spacing:.08em;background:#000}
#closing img{margin-bottom:1em}
#black,#blackout{background:#000}
#start{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b0907;font-family:system-ui,sans-serif;text-align:center;cursor:pointer}
#start b{font-size:28px;letter-spacing:.1em;color:#f3d9a0}
#start span{color:#a8916e;font-size:15px;line-height:1.8}
</style>
</head>
<body class="setup">
<div class="layer hide" id="bgImg"></div>
<div class="layer hide" id="bgLayer"><video id="bgVideo" muted playsinline loop></video></div>
<div class="layer hide" id="ovImg"></div>
<div class="layer hide" id="maskLayer"><div id="maskBox"></div></div>
<div class="layer hide serif" id="castLayer"><div id="castAll"><h2>CAST</h2><div id="castGrid"></div></div></div>
<div class="layer hide serif" id="titleLayer"><div id="ttPhase"></div><div id="ttTitle"></div></div>
<div class="layer hide serif" id="timerLayer"><div id="tPhase"></div><div id="tTitle"></div><div id="tBar"><i></i></div><div id="tLeft">TIME LEFT</div><div id="tClock">15:00</div><div id="tNote"></div></div>
<div class="layer hide" id="endWait"><img alt="" id="endWaitImg"></div>
<div class="layer hide" id="endBgA"><video id="endVidA" playsinline></video></div>
<div class="layer hide" id="endBgB"><video id="endVidB" playsinline></video></div>
<div class="layer hide serif" id="textLayer"><div id="text"></div></div>
<div class="layer hide" id="fxLayer"><video id="fxVideo" playsinline></video></div>
<div class="layer hide serif" id="closing"></div>
<div class="layer hide" id="black"></div>
<div class="layer hide" id="blackout"></div>
<div id="tPaused" hidden>PAUSE</div>
<div class="layer" id="start"><b>REQUIEⅢ　モニター画面</b><span>このウィンドウをモニターに移動してから、<br>画面をクリックしてください（全画面になり、音が出せるようになります）。</span><span id="mediaState" style="color:#efe6d4">素材を確認中…</span></div>

<script>
const BUILD="2026-11-27-13";
const C=window.THEATER_CONFIG;const $=id=>document.getElementById(id);
const ch=new BroadcastChannel("requie3-theater");
let story=null;
let show=null;
let st={mode:"standby",si:0,pi:0,paused:false,waiting:false,label:"",scene:-1};
let speed=C.speed||14,volume=0.8,run=0,started=false;
const bgm=new Audio();bgm.loop=true;let bgmKey="",bgmLevel=1,fadeTimer=null;
const sfx=new Audio();

function send(type,extra){ch.postMessage({type,...extra});}
function status(){send("status",{mode:st.mode,si:st.si,pi:st.pi,paused:st.paused,waiting:st.waiting,label:st.label,scene:st.scene,total:story?story.segs.length:0,hasStory:!!story,stamp:story&&story.stamp,media,started,build:BUILD});}
setInterval(status,1000);

// ---------- 素材の先読み（PCに保存して、ネットがなくても流せるようにする） ----------
const blobs={};let media={done:0,total:0,failed:[]};
const U=src=>blobs[src]||src;
async function preload(){
  const list=[...new Set([...Object.values(C.videos||{}),...Object.values(C.bgm||{}),...Object.values(C.images||{}),...Object.values(C.sounds||{}),...(C.characters||[]).map(c=>c.image),...(C.maskSprites||[]).map(m=>m.src),"media/cover-title.jpg"].filter(Boolean))];
  media={done:0,total:list.length,failed:[]};showMedia();
  let cache=null;try{cache=await caches.open("requie3-offline-v1");}catch(e){}
  await Promise.all(list.map(async src=>{
    try{const res=await fetch(src,{cache:"no-cache"});if(!res.ok)throw 0;
      if(cache)try{await cache.put(new URL(src,location.href).href,res.clone());}catch(e){}
      blobs[src]=URL.createObjectURL(await res.blob());}
    catch(e){media.failed.push(src);}
    media.done++;showMedia();}));
  $("endWaitImg").src=U("media/cover-title.jpg");buildCastGrid();
}
function showMedia(){const el=$("mediaState");if(el){el.textContent=media.done<media.total?`素材を読み込み中…　${media.done} / ${media.total}`:media.failed.length?`読み込めなかった素材があります：${media.failed.join("、")}`:`素材 ${media.total} 件の準備完了（ネットがなくても上映できます）`;}status();}

// ---------- 音 ----------
function setBgm(key,instant){
  if(key===bgmKey)return;bgmKey=key;const src=key&&C.bgm[key];
  fadeTo(0,instant?0:1500,()=>{if(!src){bgm.pause();return;}bgm.src=U(src);bgm.currentTime=0;bgm.play().catch(()=>{});fadeTo(bgmLevel,1500);});
}
function fadeTo(v,ms,done){clearInterval(fadeTimer);const from=bgm.volume,t0=performance.now();if(!ms){bgm.volume=Math.min(1,v*volume);done&&done();return;}
  fadeTimer=setInterval(()=>{const k=Math.min(1,(performance.now()-t0)/ms);bgm.volume=Math.max(0,Math.min(1,from+(v*volume-from)*k));if(k>=1){clearInterval(fadeTimer);done&&done();}},50);}
function duck(on){bgmLevel=on?0.25:1;fadeTo(bgmLevel,800);}
function playSfx(key){const s=C.sounds&&C.sounds[key];if(!s)return;sfx.src=U(s);sfx.volume=volume;sfx.currentTime=0;sfx.play().catch(()=>{});}

// ---------- 画面 ----------
const LAYERS=["titleLayer","bgImg","bgLayer","ovImg","maskLayer","castLayer","timerLayer","endWait","endBgA","endBgB","textLayer","fxLayer","closing","black"];
function only(...ids){LAYERS.forEach(id=>$(id).classList.toggle("hide",!ids.includes(id)));}
function show1(id,on){$(id).classList.toggle("hide",!on);}
function setBackground(key){
  const v=$("bgVideo");const img=C.images&&C.images[key],vid=C.videos&&C.videos[key];
  if(vid){if(v.dataset.src!==vid){v.dataset.src=vid;v.src=U(vid);}v.play().catch(()=>{});return "bgLayer";}
  v.pause();if(img){$("bgImg").style.backgroundImage=`url("${U(img)}")`;return "bgImg";}return null;
}
const sleep=(ms,r)=>new Promise((res,rej)=>{let acc=0,last=performance.now();(function tick(){if(r!==run)return rej("stop");const now=performance.now();if(!st.paused)acc+=now-last;last=now;if(acc>=ms)return res();requestAnimationFrame(tick);})();});
const waitResume=r=>new Promise((res,rej)=>{(function tick(){if(r!==run)return rej("stop");if(!st.paused)return res();setTimeout(tick,100);})();});

function playVideo(key,r){return new Promise((res,rej)=>{const v=$("fxVideo"),src=C.videos[key];if(!src)return res();
  v.dataset.src=src;v.src=U(src);v.muted=false;v.currentTime=0;v.volume=volume;show1("fxLayer",true);show1("black",false);duck(true);   // 黒い幕（#black）は映像より上に重なるので外す
  // 流せなかったときは理由をコントロールに出す。音ありの自動再生を止められたら、音なしで流す
  const why=m=>send("toast",{msg:`映像「${key}」：${m}`});
  v.play().catch(e=>{why(`再生できませんでした（${e.name}）。音なしで流します`);v.muted=true;v.play().catch(e2=>why(`音なしでも再生できませんでした（${e2.name}）`));});
  const end=()=>{v.onended=null;v.onerror=null;show1("fxLayer",false);duck(false);clearInterval(chk);setTimeout(res,900);};
  v.onended=end;v.onerror=()=>{why(`読み込めませんでした（エラー ${v.error&&v.error.code}）`);end();};let t0=Date.now();const chk=setInterval(()=>{if(!st.paused&&v.currentTime===0&&Date.now()-t0>4000){why("4秒たっても始まらないので飛ばしました");end();return;}if(st.paused)t0=Date.now();if(r!==run){clearInterval(chk);v.pause();show1("fxLayer",false);duck(false);rej("stop");}else if(st.paused&&!v.paused)v.pause();else if(!st.paused&&v.paused&&!v.ended)v.play().catch(()=>{});},200);
});}

// ---------- ルール説明など：背景の上の薄い黒の窓に、台本の文章（script）を1画面ずつ出す。最後の画面は残す ----------
async function showPage(page,r){
  const box=$("text");box.innerHTML="";skipPara=false;
  const lines=[];for(const line of page.split("\n").map(x=>x.trim()).filter(Boolean)){if(/^【/.test(line))lines.push({t:line,h:true});else splitBlocks(line).forEach(b=>lines.push({t:b.t,h:b.line}));}
  for(const l of lines){if(r!==run)throw"stop";if(st.paused)await waitResume(r);
    const el=document.createElement("p");el.className="fade"+(l.h?" line":"");el.textContent=l.t;box.appendChild(el);void el.offsetWidth;el.classList.add("in");
    if(!skipPara)await sleep(700,r);}
  skipPara=false;return lines.map(l=>l.t).join("").length;}
// →（次の段落）が押されるまで待つ
const waitNext=r=>new Promise((res,rej)=>{skipPara=false;(function tick(){if(r!==run)return rej("stop");if(skipPara){skipPara=false;return res();}setTimeout(tick,100);})();});
// 決まった時間待つ（→で先へ）
async function waitOrNext(ms,r){skipPara=false;let t=0;while(t<ms){if(r!==run)throw"stop";if(skipPara){skipPara=false;return;}if(!st.paused)t+=100;await new Promise(x=>setTimeout(x,100));}}
async function typeLines(page,r){for(const line of page.split("\n").map(x=>x.trim()).filter(Boolean)){
  if(/^【/.test(line)){await typePara(line,r,true);continue;}
  for(const blk of splitBlocks(line))await typePara(blk.t,r,blk.line);}}
async function playScript(sc,r){
  const pages=(sc.script||[]).filter(x=>x&&x.trim());
  $("text").innerHTML="";$("textLayer").classList.remove("onvid","intro-free");$("textLayer").classList.add("intro-box");show1("textLayer",true);
  try{await sleep(1200,r);
    for(st.pi=0;st.pi<pages.length;st.pi++){
      st.label=(sc.title||"")+" "+(st.pi+1)+"/"+pages.length+"（→で次へ）";status();
      await showPage(pages[st.pi],r);
      if(st.pi<pages.length-1){await waitNext(r);await clearText(r);await sleep(300,r);}
    }
    st.label=(sc.title||"")+"（終わり）";status();
  }catch(e){}
}

// ---------- OP の導入：待機の絵から切れ目なく OP の1コマ目へ。1コマ目で止めたまま文章が出て、intro.playFrom の段落から動き出す ----------
async function playIntro(sc,i,r){
  const v=$("endVidA"),src=C.videos[sc.video];if(!src)return;
  st.mode="intro";endBg.queue=[];endBg.cur=null;endBg.slot="A";
  v.onended=null;v.loop=false;v.muted=false;v.volume=volume;v.src=U(src);v.currentTime=0;v.pause();endBg.cur=sc.video;   // 片付け処理に止められないように
  // 待機の層は残したまま、上に OP の1コマ目をフェードで重ねる（黒は挟まない）
  ["titleLayer","ovImg","castLayer","timerLayer","endWait","endBgB","fxLayer","closing","black"].forEach(id=>show1(id,false));
  show1("endBgA",true);$("text").innerHTML="";$("textLayer").classList.remove("onvid","intro-free");$("textLayer").classList.add("intro-box");
  setBgm(sc.bgm||"");
  try{
    await sleep(1800,r);["bgImg","bgLayer"].forEach(id=>show1(id,false));show1("textLayer",true);
    const paras=(sc.intro.paras||[]).map(x=>x.trim()).filter(Boolean);let playing=false;
    const go=()=>{if(playing)return;playing=true;$("textLayer").classList.replace("intro-box","intro-free");v.play().catch(e=>{send("toast",{msg:`映像「${sc.video}」：再生できませんでした（${e.name}）。音なしで流します`});v.muted=true;v.play().catch(()=>{});});};
    const pauser=setInterval(()=>{if(r!==run){clearInterval(pauser);return;}if(!playing)return;if(st.paused&&!v.paused)v.pause();else if(!st.paused&&v.paused&&!v.ended)v.play().catch(()=>{});},200);
    for(st.pi=0;st.pi<paras.length;st.pi++){
      if(sc.intro.playFrom&&paras[st.pi].includes(sc.intro.playFrom))go();
      st.label="オープニング｜導入 "+(st.pi+1)+"/"+paras.length;status();
      const n=await showPage(paras[st.pi],r);
      await waitOrNext(Math.max(3500,n*130),r);await clearText(r);await sleep(300,r);
    }
    go();
    while(!v.ended){if(r!==run)throw"stop";await sleep(300,r);}   // 文章が先に終わったら OP の終わりまで待つ
    clearInterval(pauser);await sleep(800,r);$("textLayer").classList.remove("intro-box","intro-free");
    if(sc.autoNext)send("sceneDone",{scene:i});
  }catch(e){}
}

// ---------- エンディングの背景映像：文字は止めずに後ろで流す。終わったら最後のコマで止めて背景として残す ----------
const endBg={queue:[],cur:null,slot:"A",base:null,watch:null};
function endBgPlayNext(){
  const key=endBg.queue.shift();if(!key){endBg.cur=null;duck(false);return;}
  const src=C.videos[key];if(!src){endBgPlayNext();return;}
  const next=endBg.slot==="A"?"B":"A";const v=$("endVid"+next),old=$("endBg"+endBg.slot);
  v.onended=null;v.src=U(src);v.currentTime=0;v.volume=volume;v.loop=false;
  v.onended=()=>{v.onended=null;endBgPlayNext();};v.onerror=()=>{v.onerror=null;endBgPlayNext();};
  v.play().catch(()=>{});show1("endBg"+next,true);if(old!==$("endBg"+next))show1("endBg"+endBg.slot,false);
  endBg.slot=next;endBg.cur=key;duck(true);$("textLayer").classList.add("onvid");}
function endBgQueue(key){endBg.queue.push(key);if(!endBg.cur)endBgPlayNext();}
function endBgClear(){endBg.queue=[];endBg.cur=null;["A","B"].forEach(k=>{show1("endBg"+k,false);const v=$("endVid"+k);v.onended=null;setTimeout(()=>{if(!endBg.cur)v.pause();},1700);});$("textLayer").classList.remove("onvid");duck(false);}
// 一時停止に合わせて背景映像も止める
setInterval(()=>{if(!endBg.cur||st.mode!=="ending")return;const v=$("endVid"+endBg.slot);if(st.paused&&!v.paused)v.pause();else if(!st.paused&&v.paused&&!v.ended)v.play().catch(()=>{});},200);

function stopAll(){$("textLayer").classList.remove("intro-box","intro-free");run++;st.paused=false;st.waiting=false;$("fxVideo").pause();show1("fxLayer",false);endBgClear();duck(false);$("tPaused").hidden=true;}

// ---------- 進行表のシーン ----------
// 作った背景の明るさ（theater-config.js の stillBrightness）
document.documentElement.style.setProperty("--stillBright",String(C.stillBrightness||1));
const setBright=sc=>document.documentElement.style.setProperty("--stillBright",String(sc&&sc.brightness!=null?sc.brightness:(C.stillBrightness||1)));
function phaseLabel(p){const m={"第1フェーズ":"PHASE  I","第2フェーズ":"PHASE  II","第3フェーズ":"PHASE  III","キャラクター選択":"CHARACTER","オープニング":"OPENING"};return m[p]||p||"";}
function sceneLook(sc){
  setBright(sc);$("bgLayer").classList.toggle("drift",!!sc.drift);$("bgImg").classList.toggle("drift",!!sc.drift);
  $("bgImg").classList.toggle("still",!!sc.still);$("bgLayer").classList.toggle("still",!!sc.still);
  const ov=sc.overlay&&C.images&&C.images[sc.overlay];if(ov)$("ovImg").style.backgroundImage=`url("${U(ov)}")`;
  $("timerLayer").classList.toggle("pos-right",sc.timerPos==="right");$("timerLayer").classList.toggle("pos-top",sc.timerPos==="top");
  const out=ov?["ovImg"]:[];
  if(sc.maskTake){buildMasks();out.push("maskLayer");}
  return out;}
// ---------- 読み込みが終わったら（タイマーが0）、マスクが一斉にさささと取られる ----------
let masksTaken=false;
function buildMasks(){masksTaken=false;$("maskBox").innerHTML=(C.maskSprites||[]).map((m,k)=>`<img data-k="${k}" src="${U(m.src)}" alt="" style="left:${m.x}%;top:${m.y}%;width:${m.w}%;height:${m.h}%">`).join("");}
function takeMasks(){if(masksTaken)return;masksTaken=true;
  [...$("maskBox").children].forEach(el=>{const m=C.maskSprites[+el.dataset.k],a=m.angle*Math.PI/180;
    const dx=Math.cos(a)*75,dy=Math.sin(a)*75,rot=(Math.random()*2-1)*18,delay=Math.random()*550;
    el.animate([{transform:"none"},{transform:"scale(1.05)",offset:.18},{transform:`translate(${dx}vw,${dy}vh) rotate(${rot}deg) scale(1.05)`}],
      {duration:780,delay,easing:"cubic-bezier(.5,0,.85,.25)",fill:"forwards"});});}
function enterScene(i){
  const sc=C.scenes[i];if(!sc)return;stopAll();const r=run;st.scene=i;st.mode=sc.type;st.label=sc.title||sc.type;
  $("text").innerHTML="";timerUpFor=null;
  st.label=(sc.phase?sc.phase+"｜":"")+(sc.title||sc.type);
  const extra=sceneLook(sc);
  if(sc.type==="loop"){$("ttPhase").textContent=phaseLabel(sc.phase);$("ttTitle").textContent=sc.title||"";only(setBackground(sc.bg),...extra,...(sc.showTitle&&!sc.script?["titleLayer"]:[]));setBgm(sc.bgm||"");if(sc.script)playScript(sc,r);}
  else if(sc.type==="timer"){only(setBackground(sc.bg),...extra,"timerLayer");$("tPhase").textContent=phaseLabel(sc.phase);$("tTitle").textContent=sc.title||"";setBgm(sc.bgm||"");renderTimer();}
  else if(sc.type==="cast"){only("castLayer");setBgm(sc.bgm||"");castReveal(r);}
  else if(sc.type==="video"&&sc.intro){playIntro(sc,i,r);}
  else if(sc.type==="video"){only("black");setBgm("",true);(async()=>{try{await sleep(700,r);await playVideo(sc.video,r);if(sc.autoNext)send("sceneDone",{scene:i});}catch(e){}})();}
  else if(sc.type==="ending"){only("endWait");setBgm(sc.bgm||"");}
  status();
}

const esc=s=>String(s).replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));
function nameOf(c){return (show&&show.names&&show.names[c.id]||"").trim();}
function buildCastGrid(){$("castGrid").innerHTML=(C.characters||[]).map(c=>`<figure><img src="${U(c.image)}" alt="">${C.castHideNames?"":`<b>${esc(c.name)}</b>`}<span>${esc(nameOf(c)||"―")}</span></figure>`).join("");}
async function castReveal(r){
  const L=$("castLayer");L.querySelectorAll(".castOne").forEach(e=>e.remove());$("castAll").classList.remove("on");buildCastGrid();
  try{
    await sleep(1200,r);
    for(const c of C.characters||[]){
      const d=document.createElement("div");d.className="castOne";
      d.innerHTML=C.castHideNames?`<figure class="p1"><img src="${U(c.image)}" alt=""><figcaption>${nameOf(c)?esc(nameOf(c)):"―"}</figcaption></figure>`:`<img src="${U(c.image)}" alt=""><div><div class="lbl">CAST</div><div class="role">${esc(c.name)}</div><div class="who">${nameOf(c)?esc(nameOf(c)):"―"}</div></div>`;
      L.appendChild(d);await sleep(60,r);d.classList.add("on");st.label="配役発表："+c.name;status();
      await sleep(3600,r);d.classList.remove("on");await sleep(900,r);d.remove();
    }
    $("castAll").classList.add("on");st.label="配役発表：全員";status();
  }catch(e){}
}

// タイマー（時間はコントロール側が持ち、ここは表示と時間切れの音だけ）
let timerUpFor=null;
function remaining(){const t=show&&show.timer;if(!t)return 0;return t.endAt?Math.max(0,t.endAt-Date.now()):t.remaining;}
function renderTimer(){
  const sc=C.scenes[st.scene];if(!sc||sc.type!=="timer")return;
  const t=show&&show.timer;const ms=remaining();const s=Math.ceil(ms/1000);
  $("tClock").textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  $("tBar").firstElementChild.style.width=(t&&t.total?Math.max(0,Math.min(1,ms/t.total))*100:100)+"%";
  const up=!!t&&t.started&&ms<=0;$("tClock").classList.toggle("up",up);$("tClock").classList.toggle("warn",!up&&!!t&&t.started&&s<=60);
  $("tNote").textContent=up?"時間です":(t&&!t.started?"まもなく開始":"");
  $("tPaused").hidden=!(t&&t.started&&!t.endAt&&ms>0);
  const key=st.scene+":"+(t&&t.endAt);if(up&&t.endAt&&timerUpFor!==key){timerUpFor=key;playSfx("timeUp");if(sc.maskTake)setTimeout(takeMasks,900);}
}
setInterval(renderTimer,200);

// ---------- エンディング ----------
const paras=s=>(s.text||"").split("\n").map(x=>x.trim()).filter(Boolean);
function cuesFor(seg){return (C.cues||[]).filter(c=>new RegExp(c.seg).test(seg.id));}
function bgmFor(seg){const h=(C.sceneBgm||[]).find(b=>seg.id.includes(b.seg));return h?h.bgm:"ending";}
let skipPara=false,skipSeg=false;
// 1段落を「ひと息」ごとの短いかたまりに分ける（カギカッコの中では切らない）
function splitBlocks(p){
  const out=[];let cur="",depth=0,startDepth=0;const chars=[...p];
  const push=()=>{const t=cur.trim();if(t)out.push({t,line:startDepth>0||/^[「『]/.test(t)});cur="";startDepth=depth;};
  for(let i=0;i<chars.length;i++){const c=chars[i],nx=chars[i+1]||"";cur+=c;
    if("「『（".includes(c))depth++;else if("」』）".includes(c))depth=Math.max(0,depth-1);
    const stop="。！？!?".includes(c)&&!"」』）。！？!?…".includes(nx);
    if(depth===0&&stop)push();
    else if(depth===0&&"」』".includes(c)&&"「『".includes(nx))push();
    else if(depth>0&&stop&&cur.trim().length>=8)push();   // セリフの中も、文の切れ目で分ける
  }
  push();return out;
}
// 文字ごとの間（。や！のあとは長めに止まる）
function charDelay(chr,nx){const base=1000/speed;
  if("。".includes(chr))return base+650;
  if("！？!?".includes(chr))return "！？!?」".includes(nx)?base:base+550;
  if("」』".includes(chr))return base+450;
  if("、，".includes(chr))return base+220;
  if("…‥―".includes(chr))return base+120;
  return base;}
async function typePara(p,r,isLine){
  const box=$("text"),el=document.createElement("p");if(isLine||/^[「『]/.test(p))el.classList.add("line");
  [...box.children].forEach(x=>x.classList.add("old"));
  const keep=$("textLayer").classList.contains("intro-box")||$("textLayer").classList.contains("intro-free")?8:3;   // 窓の画面（ルール説明・OP）は1画面ぶん全部残す
  while(box.children.length>keep){box.firstElementChild.remove();}
  box.appendChild(el);const cs=[...p];
  for(let i=0;i<cs.length;i++){const chr=cs[i];if(r!==run)throw"stop";if(st.paused)await waitResume(r);
    const s=document.createElement("span");s.className="c";s.textContent=chr;el.appendChild(s);
    if(skipPara){continue;}
    if(i<cs.length-1)await sleep(charDelay(chr,cs[i+1]),r);}
  skipPara=false;
  await sleep(900+Math.min(1800,cs.length*22),r);   // かたまりとかたまりの間
}
async function clearText(r){[...$("text").children].forEach(x=>x.classList.add("gone"));await sleep(1300,r);$("text").innerHTML="";}

async function playEnding(){
  if(!story){send("toast",{msg:"エンディングがまだ届いていません。エンディングアプリで判定してください。"});return;}
  stopAll();const r=run;st.mode="ending";st.si=0;st.pi=0;endBg.base=null;
  only("black");setBgm("",true);$("text").innerHTML="";
  try{
    await sleep(1500,r);only("textLayer");
    for(st.si=0;st.si<story.segs.length;st.si++){
      let seg=story.segs[st.si];
      while(seg.pending){st.waiting=true;st.label="ルカの選択待ち";status();await sleep(500,r);seg=story.segs[st.si];}
      st.waiting=false;const ps=paras(seg);if(!ps.length)continue;
      st.label=seg.id;status();setBgm(bgmFor(seg));
      const cues=cuesFor(seg);skipSeg=false;
      // 章が変わったら背景を消す（「（その後）」は同じ場面の続きなので残す）
      const base=seg.id.replace(/（その後）$/,"");if(endBg.base!==null&&base!==endBg.base)endBgClear();endBg.base=base;
      for(const c of cues.filter(c=>c.at==="start"))endBgQueue(c.video);
      for(st.pi=0;st.pi<ps.length&&!skipSeg;st.pi++){
        for(const c of cues.filter(c=>c.at!=="start"&&c.at!=="end"&&ps[st.pi].includes(c.at)))endBgQueue(c.video);   // この段落が出始めたら流す
        status();for(const blk of splitBlocks(ps[st.pi])){if(skipSeg)break;await typePara(blk.t,r,blk.line);}
        if(st.pi<ps.length-1&&!skipSeg){await sleep(500,r);await clearText(r);await sleep(500,r);}   // 段落の切れ目：いったん消して間をあける
      }
      for(const c of cues.filter(c=>c.at==="end"))endBgQueue(c.video);
      await clearText(r);await sleep(700,r);
    }
    endBgClear();endBg.base=null;
    st.label="締めのメッセージ";status();
    $("closing").innerHTML=`<img src="${U("media/cover-title.jpg")}" alt="">`+story.closing.split("\n").map(l=>`<div>${esc(l)}</div>`).join("");
    only("closing");setBgm("epilogue");st.mode="closing";status();
  }catch(e){}
}

// ---------- 受信 ----------
function applyShow(s){
  const prev=show;show=s;
  if(!started)return;
  if(!prev||prev.scene!==s.scene||prev.nonce!==s.nonce)enterScene(s.scene);
  else if(JSON.stringify(prev.names)!==JSON.stringify(s.names))buildCastGrid();
  show1("blackout",!!s.blackout);renderTimer();
}
ch.onmessage=({data:m})=>{
  if(m.type==="story"){story={segs:m.segs,closing:m.closing,stamp:m.stamp};status();}
  else if(m.type==="show"){if(m.build&&m.build!==BUILD){if(!sessionStorage.getItem("requie3-reloaded-"+m.build)){sessionStorage.setItem("requie3-reloaded-"+m.build,"1");location.replace("theater.html?v="+Date.now());}return;}applyShow(m.show);}
  else if(m.type==="cmd"){({play:playEnding,
     pause:()=>{st.paused=!st.paused;status();},
     nextPara:()=>{skipPara=true;},takeMasks:()=>takeMasks(),nextSeg:()=>{skipSeg=true;skipPara=true;},
     speed:()=>{speed=m.value;},volume:()=>{volume=m.value;fadeTo(bgmLevel,0);$("fxVideo").volume=m.value;}
    }[m.cmd]||(()=>{}))();}
  else if(m.type==="hello")status();
};

$("start").onclick=()=>{document.documentElement.requestFullscreen?.().catch(()=>{});document.body.classList.remove("setup");$("start").remove();
  started=true;try{const s=JSON.parse(localStorage.getItem("requie3-story")||"null");if(s)story=s;}catch(e){}
  let saved=null;try{saved=JSON.parse(localStorage.getItem("requie3-show")||"null");}catch(e){}
  const s=show||saved||{scene:0,nonce:0,names:{},timer:null};show=null;applyShow(s);send("hello-monitor");};
send("hello-monitor");
if("serviceWorker" in navigator&&!/^(localhost|127\.0\.0\.1)$/.test(location.hostname))navigator.serviceWorker.register("sw.js").catch(()=>{});
preload();
</script>
</body>
